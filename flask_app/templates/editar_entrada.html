{% extends "base.html" %}

{% block title %}Editar Entrada #{{ entrada.id }}{% endblock %}

{% block content %}
<div class="form-wrapper">
    <div class="form-header">
        <a href="{{ url_for('ver_entrada', id=entrada.id) }}" class="back-link">&larr; Volver a la entrada</a>
        <h1>Editar Entrada</h1>
        <p class="subtitle">Modifica los detalles o añade actualizaciones a esta entrada.</p>
    </div>

    <form method="POST" action="{{ url_for('editar_entrada', id=entrada.id) }}" class="entry-form" id="bitacoraForm">
        <div class="form-row">
            <div class="form-group flex-2">
                <label for="titulo">Título de la entrada <span class="required">*</span></label>
                <input 
                    type="text" 
                    id="titulo" 
                    name="titulo" 
                    value="{{ entrada.titulo }}" 
                    required
                >
            </div>
            <div class="form-group flex-1">
                <label for="fecha">Fecha <span class="required">*</span></label>
                <input 
                    type="date" 
                    id="fecha" 
                    name="fecha" 
                    value="{{ entrada.fecha }}" 
                    required
                >
            </div>
        </div>

        <div class="form-row">
            <div class="form-group flex-1">
                <label for="categoria">Categoría</label>
                <input 
                    type="text" 
                    id="categoria" 
                    name="categoria" 
                    list="categorias-sugeridas" 
                    value="{{ entrada.categoria }}"
                >
                <datalist id="categorias-sugeridas">
                    <option value="Desarrollo">
                    <option value="Investigación">
                    <option value="Base de Datos">
                    <option value="Incidencia">
                    <option value="Reunión">
                    <option value="Aprendizaje">
                </datalist>
            </div>

            <div class="form-group flex-1">
                <label for="estado">Estado de la actividad</label>
                <select id="estado" name="estado">
                    <option value="Completado" {% if entrada.estado == 'Completado' %}selected{% endif %}>Completado</option>
                    <option value="En progreso" {% if entrada.estado == 'En progreso' %}selected{% endif %}>En progreso</option>
                    <option value="Pendiente" {% if entrada.estado == 'Pendiente' %}selected{% endif %}>Pendiente</option>
                    <option value="Bloqueado" {% if entrada.estado == 'Bloqueado' %}selected{% endif %}>Bloqueado</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label for="tags">Etiquetas (separadas por comas)</label>
            <input 
                type="text" 
                id="tags" 
                name="tags" 
                value="{{ entrada.tags or '' }}"
                placeholder="Ej. backend, api, refactor"
            >
        </div>

        <div class="form-group">
            <div class="label-with-counter">
                <label for="contenido">Contenido y observaciones <span class="required">*</span></label>
                <span id="charCount" class="char-counter">0 caracteres</span>
            </div>
            <textarea 
                id="contenido" 
                name="contenido" 
                rows="8" 
                required
            >{{ entrada.contenido }}</textarea>
        </div>

        <div class="form-actions">
            <a href="{{ url_for('ver_entrada', id=entrada.id) }}" class="btn btn-secondary">Cancelar</a>
            <button type="submit" class="btn btn-primary">Actualizar Cambios</button>
        </div>
    </form>
</div>
{% endblock %}
